name: Bug
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasa
      description: Qué ves y qué esperabas ver.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Cómo reproducirlo
      placeholder: "1. Ir a /es/summoner/euw/Demo-EUW\n2. ..."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Navegador / sistema
  - type: markdown
    attributes:
      value: "⚠️ No pegues tu clave de Riot (`RGAPI-…`) ni tu `.env`."
